plugins {
    id 'com.android.application'
}

android {
    namespace 'cloud.stwqy.spark'
    compileSdk 35

    defaultConfig {
        applicationId 'cloud.stwqy.spark'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

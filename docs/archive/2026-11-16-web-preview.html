<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Spark · Web 交互设计稿</title>
<style>
:root{--background:#f5f6f5;--foreground:#303832;--muted:#647068;--card:#fff;--secondary:#eef1ef;--border:#e1e6e2;--ring:#287b59;--primary:#287b59;--accent:#e7f0e9;--destructive:#b33345;--radius:10px;--font-sans:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;color:var(--foreground);font-family:var(--font-sans);font-size:14px;line-height:1.6}button,input,textarea,select{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none;border-radius:6px}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--ring);outline-offset:3px}button:hover{background:var(--secondary)}button:disabled{cursor:default;color:var(--muted);background:var(--secondary)}svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}.symbols{display:none}.preview-tools{display:flex;align-items:center;gap:8px;margin:0 0 12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}.preview-tools span{margin-right:auto}.preview-tools button{padding:6px 12px}.preview-tools button[aria-pressed=true]{background:var(--accent);color:var(--primary)}.product{background:var(--background);border-radius:var(--radius);padding:16px;max-width:1168px;margin:auto;position:relative}.workspace{display:grid;grid-template-columns:164px minmax(0,1fr);gap:28px;max-width:1040px;margin:auto;padding:20px 8px 24px;min-height:710px}.sidebar{display:flex;flex-direction:column;align-self:stretch}.brand{font-size:25px;font-weight:650;letter-spacing:-1px;padding:2px 12px 28px;color:var(--primary)}.brand span{color:var(--foreground)}.navbutton{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px 12px;margin:3px 0;font-weight:500;min-height:42px}.navbutton.active{background:var(--accent);color:var(--primary)}.navbutton .dot{width:6px;height:6px;border-radius:50%;background:var(--primary);margin-left:auto}.group-label{font-size:12px;color:var(--muted);padding:24px 12px 7px;display:flex;align-items:center;justify-content:space-between}.project-nav{font-size:13px}.sidebar-footer{margin-top:auto;padding-top:48px}.account{display:flex;align-items:center;gap:9px;padding:12px;border-top:1px solid var(--border);margin-top:10px;font-size:13px}.avatar{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:#e4e9e5;color:var(--muted);font-size:12px}.account small{display:block;color:var(--muted);font-size:11px}.main{min-width:0}.pagehead{display:flex;align-items:center;justify-content:space-between;min-height:42px;margin-bottom:24px}.pagehead h1{font-size:22px;font-weight:600;letter-spacing:-.5px;margin:0}.quiet{color:var(--muted);padding:8px;display:inline-flex;align-items:center;gap:6px}.composer{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px 20px 12px;margin-bottom:24px;transition:border-color .15s}.composer:focus-within{border-color:#8aae99}.composer textarea{border:0;width:100%;background:none;resize:vertical;min-height:72px;line-height:1.8;font-size:16px;padding:0;display:block}.composer textarea:focus{outline:0}.composer textarea::placeholder{color:var(--muted)}.tools{display:flex;gap:3px;align-items:center;flex-wrap:wrap;margin-top:12px}.tools .quiet{font-size:12px;min-height:36px;padding:6px}.tools .save{margin-left:auto}.save{background:var(--primary);color:white;padding:7px 18px;min-height:36px;font-weight:500}.save:hover{background:#21674a}.save:disabled{background:var(--secondary);color:var(--muted)}.composer-extra{padding:10px 0 4px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}.composer-extra[hidden]{display:none}.composer-extra label{font-size:12px;color:var(--muted)}.composer-extra select,.composer-extra input{border:1px solid #829087;border-radius:6px;background:var(--card);padding:7px;max-width:100%;min-width:0}.composer-extra input{flex:1}.filters{display:flex;gap:18px;align-items:center;margin:0 0 12px}.filters button{padding:6px 0;color:var(--muted);font-size:13px;border-radius:0;border-bottom:2px solid transparent}.filters button.active{color:var(--primary);border-bottom-color:var(--primary)}.filters .filter-icon{margin-left:auto;padding:6px;border:0}.note{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:20px 24px;margin-bottom:12px}.note-meta{font-size:12px;display:flex;align-items:center;gap:8px;color:var(--muted);margin-bottom:12px}.note-meta .unread{height:5px;width:5px;border-radius:50%;background:var(--primary)}.note-meta button{margin-left:auto;padding:0 4px;color:var(--muted);min-width:30px;min-height:24px}.note-body{font-size:16px;line-height:1.8;white-space:pre-line;overflow-wrap:anywhere;margin:0}.note-bottom{display:flex;align-items:center;gap:8px;margin-top:16px;flex-wrap:wrap}.project-link{color:var(--primary);display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:3px 0}.note-open{margin-left:auto;color:var(--muted);font-size:12px;padding:4px}.source{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:13px;margin-top:14px;padding:10px 12px;background:var(--background);border-radius:6px;text-decoration:none}.source:hover{color:var(--primary)}.end{color:var(--muted);font-size:12px;text-align:center;margin:26px 0 0}.project-row{padding:24px 0;border-bottom:1px solid var(--border)}.project-row h2{font-size:18px;font-weight:550;margin:0 0 8px}.project-row p{margin:0;color:var(--muted);font-size:14px}.project-row button{display:block;width:100%;text-align:left;padding:0}.status{font-size:12px;color:var(--primary);margin-top:12px}.search{display:flex;gap:10px;align-items:center;border:1px solid #829087;background:var(--card);border-radius:8px;padding:12px 14px;margin-bottom:22px}.search input{border:0;outline:none;min-width:0;width:100%;background:none;font-size:16px}.empty{padding:48px 24px;text-align:center;color:var(--muted)}.empty strong{display:block;color:var(--foreground);font-size:16px;margin-bottom:8px}.mobile-top,.mobile-nav{display:none}.notice{font-size:12px;color:var(--muted);margin-top:12px;min-height:20px}.detail{border:0;background:var(--card);border-radius:12px;width:calc(100% - 36px);max-width:600px;padding:28px;color:var(--foreground);box-shadow:0 16px 60px #14271d26}.detail::backdrop{background:#18251f55}.detail header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;color:var(--muted);font-size:13px}.detail header button{min-width:36px;min-height:36px}.detail section{border-top:1px solid var(--border);padding-top:20px;margin-top:24px}.detail h2{font-size:13px;color:var(--muted);font-weight:500;margin:0 0 10px}.detail p{margin:0}.detail small{color:var(--muted)}.more-menu{padding:8px 0}.more-menu button{display:block;width:100%;text-align:left;padding:12px}.product.phone{max-width:390px}.phone .workspace{display:block;min-height:600px;padding:4px 0 16px}.phone .sidebar{display:none}.phone .mobile-top{display:flex}.phone .mobile-nav{display:flex}.phone .pagehead{margin-bottom:18px}.phone .pagehead h1{font-size:20px}.phone .composer{padding:16px 14px 12px}.phone .note{padding:16px}.phone .note-open{padding:10px 0}.phone .tools .quiet{min-height:44px}.phone .save{min-height:44px}.mobile-top{align-items:center;justify-content:space-between;padding:2px 0 22px;color:var(--primary);font-weight:650;font-size:18px}.mobile-top small{font-size:11px;color:var(--muted);font-weight:400}.mobile-nav{position:relative;justify-content:space-around;gap:4px;padding:8px 0 2px;background:var(--background);border-top:1px solid var(--border);margin-top:20px}.mobile-nav button{font-size:11px;display:flex;align-items:center;flex-direction:column;gap:4px;padding:7px 10px;min-height:48px;color:var(--muted)}.mobile-nav button.active{color:var(--primary)}
@media(min-width:1000px){.workspace{grid-template-columns:224px minmax(0,768px);gap:48px;padding-top:24px}}@media(max-width:570px){.workspace{display:block;min-height:600px;padding:4px 0 16px}.sidebar{display:none}.mobile-top,.mobile-nav{display:flex}.note{padding:16px}.composer{padding:16px 14px 12px}.tools .quiet,.save{min-height:44px}.pagehead{margin-bottom:18px}.pagehead h1{font-size:20px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head>
<body>
<svg class="symbols" aria-hidden="true"><defs>
<symbol id="inbox" viewBox="0 0 24 24"><path d="M4 4h16l2 11v5H2v-5L4 4Z"/><path d="M2 15h6l2 3h4l2-3h6"/></symbol>
<symbol id="search" viewBox="0 0 24 24"><circle cx="10" cy="10" r="6.5"/><path d="m15 15 5 5"/></symbol>
<symbol id="folder" viewBox="0 0 24 24"><path d="M3 6a2 2 0 0 1 2-2h5l2 3h7a2 2 0 0 1 2 2v10H3Z"/></symbol>
<symbol id="layers" viewBox="0 0 24 24"><path d="m12 3 10 5-10 5L2 8l10-5Zm-9 9 9 5 9-5M3 16l9 5 9-5"/></symbol>
<symbol id="plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
<symbol id="more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></symbol>
<symbol id="trash" viewBox="0 0 24 24"><path d="M3 6h18M9 6V3h6v3M6 6l1 15h10l1-15M10 10v7M14 10v7"/></symbol>
<symbol id="link" viewBox="0 0 24 24"><path d="m10 14 4-4M9 7l3-3a5 5 0 0 1 7 7l-3 3M15 17l-3 3a5 5 0 0 1-7-7l3-3"/></symbol>
<symbol id="filter" viewBox="0 0 24 24"><path d="M4 7h16M7 12h10M10 17h4"/></symbol>
</defs></svg>
<div class="preview-tools"><span>交互稿 · 示例资料，仅在此页演示</span><button id="desktop" aria-pressed="true">桌面</button><button id="phone" aria-pressed="false">手机</button></div>
<div class="product" id="product"><div class="workspace">
<aside class="sidebar"><div class="brand">s<span>park</span></div><nav aria-label="主导航">
<button class="navbutton active" data-page="inbox"><svg><use href="#inbox"/></svg>收件箱<span class="dot"></span></button>
<button class="navbutton" data-page="search"><svg><use href="#search"/></svg>全部收藏</button>
<button class="navbutton" data-page="unclassified"><svg><use href="#layers"/></svg>待归类</button></nav>
<div class="group-label">项目<button aria-label="查看项目" data-page="projects"><svg><use href="#plus"/></svg></button></div>
<button class="navbutton project-nav" data-project="产品思考"><svg><use href="#folder"/></svg>产品思考</button>
<button class="navbutton project-nav" data-project="阅读笔记"><svg><use href="#folder"/></svg>阅读笔记</button>
<button class="navbutton project-nav" data-page="projects" style="color:var(--muted);padding-left:40px">查看全部</button>
<div class="sidebar-footer"><button class="navbutton" data-page="trash"><svg><use href="#trash"/></svg>回收站</button><button class="account" id="account"><span class="avatar">我</span><span>个人空间<small>示例账号</small></span><svg><use href="#more"/></svg></button></div></aside>
<main class="main"><div class="mobile-top">spark <small>示例空间</small></div><header class="pagehead"><h1 id="title">收件箱</h1><button class="quiet" data-page="search" aria-label="搜索收藏"><svg><use href="#search"/></svg></button></header>
<div id="project-description" hidden></div>
<form class="composer" id="composer"><label for="writing" style="position:absolute;clip-path:inset(50%);width:1px;height:1px;overflow:hidden">记录内容</label><textarea id="writing" placeholder="记下想法，或粘贴网址…"></textarea>
<div class="composer-extra" id="project-picker" hidden><label for="project">关联项目</label><select id="project"><option value="">暂不关联</option><option>产品思考</option><option>阅读笔记</option></select></div>
<div class="composer-extra" id="intent-picker" hidden><label for="intent">用途</label><input id="intent" placeholder="以后可能用在哪儿？"></div>
<div class="tools"><button type="button" class="quiet" id="intent-toggle" aria-expanded="false">补一句用途</button><button type="button" class="quiet" id="project-toggle" aria-expanded="false"><svg><use href="#plus"/></svg>项目</button><button class="save" id="save" disabled>保存</button></div></form>
<div class="search" id="searchbox" style="display:none"><svg><use href="#search"/></svg><input id="query" aria-label="搜索收藏" placeholder="搜索收藏中的文字…"><button id="clear" aria-label="清空搜索">×</button></div>
<div class="filters" id="filters"><button class="active" data-filter="all">全部</button><button data-filter="unread">未读</button><button class="filter-icon" id="filter" aria-label="筛选说明"><svg><use href="#filter"/></svg></button></div>
<div id="feed"></div><p class="notice" id="notice" role="status" aria-live="polite"></p>
<nav class="mobile-nav" aria-label="手机导航"><button class="active" data-page="inbox"><svg><use href="#inbox"/></svg>收件箱</button><button data-page="projects"><svg><use href="#folder"/></svg>项目</button><button data-page="search"><svg><use href="#search"/></svg>搜索</button><button id="mobile-more"><svg><use href="#more"/></svg>更多</button></nav>
</main></div></div>
<dialog class="detail" id="detail"><header><span id="dialog-title">收藏详情 · 示例</span><button id="close-detail" aria-label="关闭详情">×</button></header><div id="detail-content"></div></dialog>
<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const icon=id=>`<svg aria-hidden="true"><use href="#${id}"/></svg>`;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let notes=[{id:1,time:'今天 10:42',body:'好的收集工具，应该让人先把想法留下来。\n\n至于它属于哪个项目，可以等想清楚了再决定。',project:'产品思考',intent:'设计收集入口时回看',unread:true},{id:2,time:'今天 09:18',body:'读书时不急着概括整章。先留下一句真正让自己停下来的话，再写下为什么。',project:'阅读笔记',intent:'试着用这个方法做下一本书的笔记',unread:false},{id:3,time:'昨天 21:06',body:'周末试一下：整理桌面上那些一直没关的网页，把每个链接值得留下的原因写成一句话。',project:'',intent:'',unread:true}];
let page='inbox',selectedProject='',filter='all';
function notify(s){$('#notice').textContent=s}
function card(n){return `<article class="note"><div class="note-meta">${esc(n.time)}${n.unread?'<span class="unread" aria-label="未读"></span>':''}<button data-detail="${n.id}" aria-label="打开收藏详情">${icon('more')}</button></div><p class="note-body">${esc(n.body)}</p><div class="note-bottom">${n.project?`<button class="project-link" data-project="${esc(n.project)}">${icon('folder')}${esc(n.project)}</button>`:''}<button class="note-open" data-detail="${n.id}">查看全文</button></div></article>`}
function render(){const composing=page==='inbox'||page==='project';$('#composer').hidden=!composing;$('#searchbox').style.display=page==='search'?'flex':'none';$('#filters').hidden=['projects','trash','more'].includes(page);$('#title').textContent={inbox:'收件箱',search:'全部收藏',unclassified:'待归类',projects:'项目',project:selectedProject,trash:'回收站',more:'更多'}[page];$$('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));$$('[data-filter]').forEach(b=>b.classList.toggle('active',b.dataset.filter===filter));
if(page==='projects'){$('#feed').innerHTML=['产品思考','阅读笔记'].map((p,i)=>`<article class="project-row"><button data-project="${p}"><h2>${p}</h2><p>${i?'把读过的内容，变成自己的理解。':'记录对产品体验的观察，以及值得试一试的想法。'}</p><div class="status">进行中</div></button></article>`).join('');return}
if(page==='more'){$('#feed').innerHTML='<div class="more-menu"><button data-page="unclassified">待归类</button><button data-page="trash">回收站</button><button id="settings-demo">账号与设置（设计范围说明）</button></div>';return}
let list=notes.filter(n=>(filter!=='unread'||n.unread)&&(page!=='unclassified'||!n.project)&&(page!=='project'||n.project===selectedProject)&&(page!=='search'||n.body.includes($('#query').value.trim())||n.project.includes($('#query').value.trim())));if(page==='trash')list=[];
$('#feed').innerHTML=list.length?list.map(card).join('')+'<p class="end">已显示全部示例资料</p>':`<div class="empty"><strong>${page==='trash'?'回收站是空的':page==='search'?'没有找到相关收藏':'这里还没有收藏'}</strong>${page==='search'?'换一个词试试，或清空搜索。':'先把值得留下的内容记下来。'}</div>`}
function go(p,project=''){page=p;selectedProject=project;filter='all';notify('');if(p==='project'){$('#project').value=project;$('#project-picker').hidden=false;$('#project-toggle').setAttribute('aria-expanded','true')}render();if(p==='search')$('#query').focus()}
function showDetail(n){$('#dialog-title').textContent=n.time+' · 示例收藏';$('#detail-content').innerHTML=`<p class="note-body">${esc(n.body)}</p><section><h2>用途</h2><p>${esc(n.intent||'尚未填写')}</p></section><section><h2>关联项目</h2><p style="color:var(--primary)">${esc(n.project||'暂未关联')}</p></section><section><small>自动整理暂未开放。此交互稿仅演示阅读层级，编辑、版本冲突与删除行为详见设计规范。</small></section>`;$('#detail').showModal()}
document.addEventListener('click',e=>{const p=e.target.closest('[data-page]'),pr=e.target.closest('[data-project]'),d=e.target.closest('[data-detail]'),f=e.target.closest('[data-filter]');if(p)go(p.dataset.page);else if(pr)go('project',pr.dataset.project);else if(d)showDetail(notes.find(n=>n.id===Number(d.dataset.detail)));else if(f){filter=f.dataset.filter;render()}if(e.target.id==='settings-demo')notify('账号表单沿用统一控件；此稿重点演示收集、项目与搜索。')});
['project','intent'].forEach(key=>$('#'+key+'-toggle').onclick=()=>{const box=$('#'+key+'-picker');box.hidden=!box.hidden;$('#'+key+'-toggle').setAttribute('aria-expanded',String(!box.hidden));if(!box.hidden)$('#'+key).focus()});
$('#writing').oninput=()=>$('#save').disabled=!$('#writing').value.trim();$('#composer').onsubmit=e=>{e.preventDefault();const body=$('#writing').value.trim();if(!body)return;notes.unshift({id:Date.now(),time:'刚刚',body,project:$('#project').value,intent:$('#intent').value,unread:true});$('#writing').value='';$('#intent').value='';$('#save').disabled=true;render();notify('演示已保存，仅保留在当前页面；刷新后恢复示例。');$('#writing').focus()};$('#writing').onkeydown=e=>{if((e.metaKey||e.ctrlKey)&&e.key==='Enter'&&!e.isComposing){e.preventDefault();$('#composer').requestSubmit()}};
$('#query').oninput=render;$('#clear').onclick=()=>{$('#query').value='';render();$('#query').focus()};$('#filter').onclick=()=>notify('本稿演示全部 / 未读筛选；实际版本保留类型等现有筛选。');$('#close-detail').onclick=()=>$('#detail').close();$('#account').onclick=()=>go('more');$('#mobile-more').onclick=()=>go('more');
['desktop','phone'].forEach(mode=>$('#'+mode).onclick=()=>{$('#product').classList.toggle('phone',mode==='phone');['desktop','phone'].forEach(m=>$('#'+m).setAttribute('aria-pressed',String(m===mode)))});render();
</script></body></html>

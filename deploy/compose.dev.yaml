name: spark-local

x-api-environment: &api-environment
  SPARK_ENV: development
  SPARK_CONTAINER: 'true'
  SPARK_ADDR: 0.0.0.0:8080
  SPARK_ORIGIN: http://127.0.0.1:5173
  DATABASE_URL: postgres://spark:${SPARK_DEV_DB_PASSWORD:?Set SPARK_DEV_DB_PASSWORD}@postgres:5432/spark_dev?sslmode=disable
  SPARK_SECRET: ${SPARK_SECRET:?Set SPARK_SECRET}
  SPARK_ENCRYPTION_KEY: ${SPARK_ENCRYPTION_KEY:?Set SPARK_ENCRYPTION_KEY}
  SPARK_MAIL_MODE: development

services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: spark
      POSTGRES_DB: spark_dev
      POSTGRES_PASSWORD: ${SPARK_DEV_DB_PASSWORD:?Set SPARK_DEV_DB_PASSWORD for isolated local database}
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - spark_dev_pg:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U spark -d spark_dev"]
      interval: 3s
      timeout: 3s
      retries: 20
    mem_limit: 768m
  api:
    image: spark-api:dev
    build:
      context: ../server
      target: runtime
    environment: *api-environment
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [CMD, /spark, healthcheck]
      interval: 5s
      timeout: 3s
      retries: 10
    read_only: true
    stop_grace_period: 15s
    mem_limit: 512m
  web:
    build:
      context: ../apps/web
    environment:
      VITE_DEV_HOST: 0.0.0.0
      VITE_API_PROXY_TARGET: http://api:8080
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      api:
        condition: service_healthy
    mem_limit: 512m
  tools:
    image: spark-api:dev
    build:
      context: ../server
      target: runtime
    entrypoint: [/spark]
    environment: *api-environment
    depends_on:
      postgres:
        condition: service_healthy
    profiles: [tools]
    read_only: true
    mem_limit: 512m
  test:
    image: spark-server-test:dev
    build:
      context: ../server
      target: test
    environment:
      SPARK_TEST_DATABASE_URL: postgres://spark:${SPARK_DEV_DB_PASSWORD:?Set SPARK_DEV_DB_PASSWORD}@postgres:5432/spark_test?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    profiles: [test]
    mem_limit: 1536m

volumes:
  spark_dev_pg:

# Include with the OSS overlay when enablement and image consent are ready.
services:
  api:
    environment:
      SPARK_IMAGE_ANALYSIS_ADMIN_ID: ${SPARK_IMAGE_ANALYSIS_ADMIN_ID:-}
      SPARK_IMAGE_ANALYSIS_ENABLED: ${SPARK_IMAGE_ANALYSIS_ENABLED:-false}

  worker:
    environment:
      SPARK_IMAGE_ANALYSIS_ADMIN_ID: ${SPARK_IMAGE_ANALYSIS_ADMIN_ID:-}
      SPARK_IMAGE_ANALYSIS_ENABLED: ${SPARK_IMAGE_ANALYSIS_ENABLED:-false}

  image-worker:
    image: ${SPARK_API_IMAGE:-spark-api:prod}
    build:
      context: ../server
      target: runtime
    entrypoint: [/spark-worker, images]
    profiles: [image-analysis]
    restart: unless-stopped
    environment:
      SPARK_ENV: ${SPARK_ENV:-production}
      DATABASE_URL: ${SPARK_IMAGE_WORKER_DATABASE_URL:-postgres://spark:${SPARK_DB_PASSWORD:-${SPARK_DEV_DB_PASSWORD:-missing}}@postgres:5432/${SPARK_DB_NAME:-spark}?sslmode=disable}
      SPARK_IMAGE_ANALYSIS_ADMIN_ID: ${SPARK_IMAGE_ANALYSIS_ADMIN_ID:-}
      SPARK_IMAGE_ANALYSIS_ENABLED: ${SPARK_IMAGE_ANALYSIS_ENABLED:-false}
      SPARK_IMAGE_ANALYSIS_KEY_FILE: /run/secrets/spark-image-analysis-key
      SPARK_OSS_ENABLED: ${SPARK_OSS_ENABLED:-false}
      SPARK_OSS_CONFIG_FILE: /run/spark-oss/config.json
    volumes:
      - type: bind
        source: ${SPARK_OSS_CONFIG_HOST_PATH:-/etc/spark/oss/config.json}
        target: /run/spark-oss/config.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${SPARK_OSS_CREDENTIALS_HOST_PATH:-/etc/spark/oss/credentials.json}
        target: /run/secrets/spark-oss-credentials.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${SPARK_IMAGE_ANALYSIS_KEY_HOST_PATH:-/etc/spark/image-analysis/api-key}
        target: /run/secrets/spark-image-analysis-key
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [CMD, /spark-worker, healthcheck]
      interval: 10s
      timeout: 3s
      retries: 10
    read_only: true
    stop_grace_period: 30s
    mem_limit: 256m

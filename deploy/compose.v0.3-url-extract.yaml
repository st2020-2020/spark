# Optional link-preview capability. Use only after approving the fetcher's
# outbound network policy. The worker has no OSS, OCR or text-AI credentials.
services:
  api:
    environment:
      SPARK_URL_EXTRACT_ENABLED: ${SPARK_URL_EXTRACT_ENABLED:-false}

  url-worker:
    image: ${SPARK_API_IMAGE:-spark-api:prod}
    build:
      context: ../server
      target: runtime
    entrypoint: [/spark-worker, urls]
    profiles: [url-extract]
    restart: unless-stopped
    environment:
      SPARK_URL_EXTRACT_ENABLED: ${SPARK_URL_EXTRACT_ENABLED:-false}
      DATABASE_URL: ${SPARK_URL_WORKER_DATABASE_URL:-postgres://spark:${SPARK_DB_PASSWORD:-${SPARK_DEV_DB_PASSWORD:-missing}}@postgres:5432/${SPARK_DB_NAME:-spark}?sslmode=disable}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [CMD, /spark-worker, healthcheck]
      interval: 10s
      timeout: 3s
      retries: 10
    read_only: true
    stop_grace_period: 30s
    mem_limit: 256m

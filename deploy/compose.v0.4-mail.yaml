# Production mail service, combined with exactly one provider overlay.
services:
  mail-worker:
    image: spark-api:prod
    restart: unless-stopped
    entrypoint: [/spark-worker, mail]
    profiles: [mail]
    environment:
      SPARK_ENV: production
      DATABASE_URL: postgres://spark:${SPARK_DB_PASSWORD:?Set SPARK_DB_PASSWORD}@postgres:5432/spark?sslmode=disable
      SPARK_ENCRYPTION_KEY: ${SPARK_ENCRYPTION_KEY:?Set SPARK_ENCRYPTION_KEY}
      SPARK_MAIL_MODE: ${SPARK_MAIL_MODE:-disabled}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [CMD, /spark-worker, healthcheck]
      interval: 10s
      timeout: 3s
      retries: 10
    read_only: true
    stop_grace_period: 30s
    mem_limit: 128m
